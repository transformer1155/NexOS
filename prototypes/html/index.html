<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexOS 独立 .mex 应用交互原型</title>
<style>
  :root{
    --bg:#eef2f8; --panel:#fff; --line:#e1e7f0; --text:#1c2532; --sub:#6b7688;
    --accent:#2563eb; --accent-soft:#e8f0ff; --glass:rgba(255,255,255,.78);
    --real:#0f9d58; --stub:#e08b18; --missing:#8792a3;
    --shadow:0 18px 48px rgba(30,50,90,.16),0 2px 8px rgba(30,50,90,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       color:var(--text);background:var(--bg);height:100vh;overflow:hidden}
  button,input{font:inherit}
  .shell{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);
         border-bottom:1px solid var(--line);flex:none}
  header h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px}
  header .hint{color:var(--sub);font-size:12px}
  .spacer{flex:1}
  .pill{padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
        font-size:11px;font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;
       cursor:pointer;color:var(--text);transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:#f7faff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1d55d0;color:#fff}

  .main{display:grid;grid-template-columns:236px minmax(0,1fr) 296px;flex:1;min-height:0}
  aside{background:var(--panel);min-height:0;display:flex;flex-direction:column}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  .sec{padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
  .sec h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--sub)}
  .search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;outline:none}
  .search:focus{border-color:var(--accent)}
  .filters{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;
        font-size:11px;cursor:pointer;color:var(--sub)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .applist{overflow:auto;flex:1;padding:6px}
  .item{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;cursor:pointer;
        border:1px solid transparent;margin-bottom:2px}
  .item:hover{background:#f5f8fd}
  .item.on{background:var(--accent-soft);border-color:#cfe0ff}
  .item .k{width:24px;height:24px;border-radius:6px;background:#f0f4fa;color:var(--sub);
           display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
  .item.on .k{background:var(--accent);color:#fff}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .nm small{color:var(--sub);font-size:10.5px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dot.real{background:var(--real)} .dot.stub{background:var(--stub)} .dot.missing{background:var(--missing)}

  .stage{position:relative;overflow:auto;background:
    radial-gradient(1100px 600px at 70% -10%,#d9e7ff 0%,transparent 60%),
    linear-gradient(160deg,#eaf1fb,#dfe8f6 60%,#e9eef8)}
  .stage-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
             padding:8px 14px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);
             border-bottom:1px solid rgba(255,255,255,.7);font-size:12px}
  .stage-bar b{font-weight:650}
  .stage-bar .sub{color:var(--sub)}
  #desk{position:relative;min-height:calc(100% - 38px);padding:22px}
  .win{position:absolute;border-radius:11px;background:var(--glass);backdrop-filter:blur(18px);
       box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85);overflow:hidden}
  .win.active{outline:2px solid rgba(37,99,235,.35)}
  .titlebar{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;
            background:rgba(255,255,255,.62);border-bottom:1px solid rgba(255,255,255,.8);
            font-size:12px;font-weight:600;user-select:none}
  .titlebar .h{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb{width:26px;height:22px;border:none;background:transparent;border-radius:5px;cursor:pointer;
      color:var(--sub);font-size:13px;line-height:1}
  .tb:hover{background:#e8eef8;color:var(--text)}
  .tb.close:hover{background:#e81123;color:#fff}
  .client{position:relative;background:rgba(255,255,255,.55)}
  .ctl{position:absolute;border-radius:6px;overflow:hidden}
  .ctl[data-t="button"],.ctl[data-t="toolbar"],.ctl[data-t="tabs"],.ctl[data-t="stepper"]{
    display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;
    border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:11.5px;
    box-shadow:0 1px 2px rgba(30,50,90,.06)}
  .ctl[data-t="button"]:hover,.ctl .mini:hover{border-color:var(--accent);color:var(--accent)}
  .ctl.pressed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .ctl[data-t="toolbar"],.ctl[data-t="tabs"],.ctl[data-t="stepper"]{background:transparent;border:none;
    box-shadow:none;gap:5px;justify-content:flex-start;padding:0}
  .ctl .mini{height:100%;min-width:52px;padding:0 10px;display:grid;place-items:center;
    background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap}
  .ctl .mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl[data-t="display"]{background:#f8fbff;border:1px solid var(--line);display:flex;
    align-items:flex-end;justify-content:flex-end;padding:10px 14px;font-size:26px;font-weight:300;color:var(--text)}
  .ctl[data-t="input"] input{width:100%;height:100%;border:1px solid var(--line);border-radius:6px;
    padding:0 10px;background:#fff;outline:none;color:var(--text);font-size:12px}
  .ctl[data-t="input"] input:focus{border-color:var(--accent)}
  .ctl[data-t="label"],.ctl[data-t="statusbar"]{display:flex;align-items:center;padding:0 8px;
    color:var(--sub);font-size:11px;background:rgba(255,255,255,.5)}
  .ctl[data-t="statusbar"]{border-top:1px solid var(--line);background:rgba(240,245,252,.8)}
  .ctl[data-t="panel"],.ctl[data-t="canvas"]{background:#fff;border:1px solid var(--line);
    padding:8px 10px;font-size:11px;color:var(--sub)}
  .ctl[data-t="canvas"]{background:linear-gradient(135deg,#f7faff,#eef4ff);
    display:grid;place-items:center;color:#9aa8bd;font-size:12px}
  .ctl[data-t="list"],.ctl[data-t="grid"],.ctl[data-t="log"]{background:#fff;border:1px solid var(--line);
    padding:6px;font-size:11px;color:var(--sub);overflow:hidden}
  .ctl .row{padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctl .row:hover{background:var(--accent-soft)}
  .ctl[data-t="progress"],.ctl[data-t="slider"]{background:#e8edf5;border:1px solid var(--line);
    border-radius:999px;cursor:pointer}
  .ctl .fill{height:100%;width:35%;background:linear-gradient(90deg,#4f8bff,var(--accent));border-radius:999px}
  .ctl[data-t="chart"]{background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
  .ctl[data-t="chart"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;
    background:linear-gradient(180deg,rgba(37,99,235,.22),rgba(37,99,235,.02));
    clip-path:polygon(0 70%,12% 48%,26% 62%,40% 30%,55% 52%,70% 24%,85% 44%,100% 18%,100% 100%,0 100%)}
  .ctl[data-t="toggle"]{background:#fff;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:0 8px;cursor:pointer;font-size:11px}
  .ctl[data-t="toggle"] .sw{width:30px;height:16px;border-radius:999px;background:#cfd8e6;position:relative;transition:.18s}
  .ctl[data-t="toggle"] .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
    border-radius:50%;background:#fff;transition:.18s}
  .ctl[data-t="toggle"].on{border-color:var(--accent)}
  .ctl[data-t="toggle"].on .sw{background:var(--accent)}
  .ctl[data-t="toggle"].on .sw::after{left:16px}
  .ctl.flash{animation:flash .5s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}100%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}

  .inspect{overflow:auto;flex:1;padding:12px}
  .inspect h3{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub)}
  .inspect h3:first-child{margin-top:0}
  .kv{display:flex;gap:8px;padding:3px 0;font-size:11.5px}
  .kv span:first-child{color:var(--sub);min-width:64px;flex:none}
  .tag{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:5px;
       margin:2px 3px 2px 0;font-size:10.5px;background:#f8fafd}
  ul.tight{margin:0;padding-left:16px;font-size:11.5px;color:var(--sub)}
  ul.tight li{margin:3px 0}
  #log{font:11px/1.55 ui-monospace,Consolas,monospace;background:#0f1726;color:#c8d6ea;
       border-radius:8px;padding:9px;height:210px;overflow:auto;flex:none}
  #log div{margin:2px 0;white-space:pre-wrap;word-break:break-all}
  #log .t{color:#6f86a8}
  #log .launch{color:#7ee2a8} #log .click{color:#9ec5ff} #log .key{color:#ffd48a}
  #log .close{color:#ff9c9c} #log .menu{color:#c9a7ff} #log .sys{color:#8fa2bd}
  .ctx{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:8px;
       box-shadow:var(--shadow);padding:5px;min-width:158px;display:none}
  .ctx div{padding:6px 11px;border-radius:5px;cursor:pointer;font-size:12px}
  .ctx div:hover{background:var(--accent-soft);color:var(--accent)}
  .ctx hr{border:none;border-top:1px solid var(--line);margin:4px 0}
  .empty{color:var(--sub);font-size:12px;padding:30px;text-align:center}
  .legend{display:flex;gap:10px;font-size:10.5px;color:var(--sub);align-items:center}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>NexOS · 独立 .mex 应用交互原型</h1>
    <span class="pill" id="count">18 apps</span>
    <span class="hint">数据来自 <code>prototypes/specs.json</code> · 改完跑 <code>python3 prototypes/gen.py</code></span>
    <span class="spacer"></span>
    <span class="legend"><i class="dot real"></i>real <i class="dot stub"></i>stub <i class="dot missing"></i>missing</span>
    <button class="btn" id="btnNew">新建窗口</button>
    <button class="btn" id="btnClear">清空日志</button>
  </header>

  <div class="main">
    <aside class="left">
      <div class="sec">
        <input class="search" id="search" placeholder="搜索应用 / Kind…">
        <div class="filters" id="filters">
          <span class="chip on" data-f="all">全部</span>
          <span class="chip" data-f="real">real</span>
          <span class="chip" data-f="stub">stub</span>
          <span class="chip" data-f="missing">missing</span>
        </div>
      </div>
      <div class="applist" id="applist"></div>
    </aside>

    <section class="stage" id="stage">
      <div class="stage-bar">
        <b id="stageTitle">桌面</b>
        <span class="sub" id="stageSub">双击左侧应用打开窗口 · 控件可点击 · 右键弹出菜单 · 键盘有反馈</span>
        <span class="spacer"></span>
        <button class="btn primary" id="btnOpen">打开窗口</button>
      </div>
      <div id="desk"></div>
    </section>

    <aside class="right">
      <div class="sec">
        <h2>事件日志（模拟串口）</h2>
        <div id="log"></div>
      </div>
      <div class="inspect" id="inspector"></div>
    </aside>
  </div>
</div>

<div class="ctx" id="ctx"></div>

<script>
(function(){
  "use strict";
  var APPS = window.NEX_APPS || [], META = window.NEX_META || {};
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

  var state = { filter:"all", q:"", current:null, handle:64, wins:[], active:null };
  state.current = APPS.filter(function(a){return a.key==="Notepad";})[0] || APPS[0];

  function clock(){
    var d = new Date();
    return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
  }
  function log(kind, text){
    var box = $("#log");
    var d = document.createElement("div");
    d.className = kind;
    d.innerHTML = '<span class="t">'+clock()+'</span> '+esc(text);
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
    while(box.children.length > 220) box.removeChild(box.firstChild);
  }

  // ---- left list -------------------------------------------------
  function renderList(){
    var box = $("#applist"); box.innerHTML = "";
    var n = 0;
    APPS.forEach(function(a){
      if(state.filter!=="all" && a.status!==state.filter) return;
      if(state.q && (a.key+a.zh+a.id).toLowerCase().indexOf(state.q)<0) return;
      n++;
      var d = document.createElement("div");
      d.className = "item"+(state.current && state.current.key===a.key?" on":"");
      d.innerHTML = '<span class="k">'+a.id+'</span><span class="nm"><b>'+esc(a.zh)+
                    '</b><small>'+esc(a.key)+' · '+esc(a.title)+'</small></span>'+
                    '<i class="dot '+a.status+'"></i>';
      d.onclick = function(){ state.current=a; renderList(); renderInspector(); openWindow(a); };
      box.appendChild(d);
    });
    if(!n) box.innerHTML = '<div class="empty">没有匹配的应用</div>';
    $("#count").textContent = APPS.length+" apps";
  }

  // ---- inspector -------------------------------------------------
  function renderInspector(){
    var a = state.current, box = $("#inspector");
    if(!a){ box.innerHTML='<div class="empty">请选择一个应用</div>'; return; }
    var h = "";
    h += "<h3>基本信息</h3>";
    h += '<div class="kv"><span>Kind</span><b>'+a.id+'</b></div>';
    h += '<div class="kv"><span>程序集</span><b>'+esc(a.key)+'.mex</b></div>';
    h += '<div class="kv"><span>状态</span><b>'+esc(a.status)+'</b></div>';
    h += '<div class="kv"><span>窗口</span><span>'+a.win[0]+'×'+a.win[1]+' (min '+a.win[2]+'×'+a.win[3]+')</span></div>';
    h += '<div class="kv"><span>控件</span><span>'+a.layout.length+' 个</span></div>';
    h += "<h3>键位</h3>";
    Object.keys(a.keys).forEach(function(k){
      h += '<div class="kv"><span>'+esc(k)+'</span><span>'+esc(a.keys[k])+'</span></div>';
    });
    h += "<h3>状态字段（建议）</h3><div>";
    a.state.forEach(function(s){ h += '<span class="tag">'+esc(s)+'</span>'; });
    h += "</div><h3>事件序列</h3><ul class=\"tight\">";
    a.events.forEach(function(e){ h += "<li>"+esc(e)+"</li>"; });
    h += "</ul><h3>验收点</h3><ul class=\"tight\">";
    a.accept.forEach(function(e){ h += "<li>"+esc(e)+"</li>"; });
    h += "</ul><h3>右键菜单</h3><div>";
    a.menu.forEach(function(m){ h += '<span class="tag">'+esc(m)+'</span>'; });
    h += "</div><h3>契约</h3><div class=\"kv\"><span>入口</span><span style=\"font:10.5px ui-monospace,monospace\">"+
         esc(META.contract||"")+"</span></div>";
    box.innerHTML = h;
  }

  // ---- control rendering -----------------------------------------
  function controlHtml(c){
    var st = 'left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px';
    var inner = "", t = c.t, txt = esc(c.text||"");
    if(t==="button") inner = txt;
    else if(t==="toolbar"||t==="tabs"||t==="stepper"){
      inner = (c.items||[txt]).map(function(it,i){
        return '<span class="mini'+(i===0?" on":"")+'" data-item="'+esc(it)+'">'+esc(it)+'</span>';
      }).join("");
    }
    else if(t==="input") inner = '<input placeholder="'+txt+'" data-cid="'+esc(c.id)+'">';
    else if(t==="display") inner = txt;
    else if(t==="label"||t==="statusbar"||t==="panel"||t==="canvas") inner = txt;
    else if(t==="list"||t==="grid"||t==="log"){
      var rows = t==="log" ? ["[init] app ready", "[hint] 右键查看菜单", "[hint] 点击控件看事件日志"]
                           : ["项目 A", "项目 B", "项目 C", "项目 D"];
      inner = rows.map(function(r){return '<div class="row">'+esc(r)+'</div>';}).join("");
    }
    else if(t==="progress"||t==="slider") inner = '<div class="fill"></div>';
    else if(t==="toggle") inner = '<span>'+txt+'</span><span class="sw"></span>';
    else if(t==="chart") inner = '<span style="position:absolute;top:6px;left:9px;z-index:1">'+txt+'</span>';
    else inner = txt;
    return '<div class="ctl" data-t="'+t+'" data-cid="'+esc(c.id||"c")+'" style="'+st+'">'+inner+'</div>';
  }

  // ---- windows ----------------------------------------------------
  function bringFront(win){
    state.wins.forEach(function(w){ w.el.classList.remove("active"); });
    win.el.classList.add("active");
    win.el.style.zIndex = ++state.z;
    state.active = win;
  }
  state.z = 10;

  function openWindow(app){
    app = app || state.current;
    if(!app) return;
    var uid = state.handle++;
    var slot = 1 + (state.wins.length % 7);
    var off = (state.wins.length % 4) * 26;
    var el = document.createElement("div");
    el.className = "win active";
    el.style.width = (app.win[0]+2)+"px";
    el.style.left = (24+off)+"px";
    el.style.top = (18+off)+"px";
    el.style.zIndex = ++state.z;
    var body = app.layout.map(controlHtml).join("");
    el.innerHTML =
      '<div class="titlebar"><span class="h">'+esc(app.title)+'</span>'+
      '<button class="tb" data-act="min" title="最小化">—</button>'+
      '<button class="tb" data-act="max" title="最大化">□</button>'+
      '<button class="tb close" data-act="close" title="关闭">×</button></div>'+
      '<div class="client" style="width:'+app.win[0]+'px;height:'+app.win[1]+'px">'+body+'</div>';
    $("#desk").appendChild(el);
    var win = { uid:uid, slot:slot, app:app, el:el };
    state.wins.push(win);
    bringFront(win);
    $("#stageTitle").textContent = app.zh + " · " + app.key + ".mex";
    $("#stageSub").textContent = "handle "+uid+" → CLR slot "+slot+" · 每个窗口独立映像";
    log("launch", "[gui] opening standalone app "+app.id+" (Kind "+app.id+")");
    log("launch", "[MFORMS] standalone app live in slot "+slot+" handle "+uid);
    renderInspector();
    wireWindow(win);
    return win;
  }

  function closeWindow(win){
    if(!win) return;
    log("close", "[MFORMS] standalone slot "+win.slot+" released  (handle "+win.uid+")");
    win.el.remove();
    state.wins = state.wins.filter(function(w){ return w!==win; });
    if(state.active===win){ state.active = state.wins[state.wins.length-1]||null;
      if(state.active) bringFront(state.active); }
  }

  function flash(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

  function wireWindow(win){
    var el = win.el, app = win.app;
    el.addEventListener("mousedown", function(){ bringFront(win); });
    el.querySelector(".titlebar").addEventListener("click", function(e){
      var b = e.target.closest("[data-act]"); if(!b) return;
      var act = b.getAttribute("data-act");
      if(act==="close") closeWindow(win);
      else if(act==="min"){ el.style.display="none"; log("sys","[win] minimise handle "+win.uid); }
      else { log("sys","[win] maximise/restore handle "+win.uid); }
    });
    el.querySelector(".client").addEventListener("click", function(e){
      var mini = e.target.closest("[data-item]");
      var ctl = e.target.closest(".ctl");
      if(!ctl) return;
      var cid = ctl.getAttribute("data-cid"), t = ctl.getAttribute("data-t");
      if(mini){
        ctl.querySelectorAll(".mini").forEach(function(m){m.classList.remove("on");});
        mini.classList.add("on");
        log("click", "Click("+win.uid+") → "+cid+" / "+mini.getAttribute("data-item"));
      } else {
        log("click", "Click("+win.uid+") → "+cid+" ["+t+"] "+(ctl.getAttribute("data-text")||""));
      }
      if(t==="toggle") ctl.classList.toggle("on");
      if(t==="progress"||t==="slider"){
        var r = ctl.getBoundingClientRect();
        var pct = Math.max(5, Math.min(100, Math.round((e.clientX-r.left)/r.width*100)));
        var fill = ctl.querySelector(".fill"); if(fill) fill.style.width = pct+"%";
      }
      flash(ctl);
    });
    el.querySelector(".client").addEventListener("contextmenu", function(e){
      e.preventDefault(); showMenu(app, win, e.clientX, e.clientY);
    });
    el.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("keydown", function(e){
        log("key", "Key("+win.uid+", '"+e.key+"') → "+inp.getAttribute("data-cid"));
      });
    });
  }

  // ---- context menu ----------------------------------------------
  function showMenu(app, win, x, y){
    var m = $("#ctx");
    m.innerHTML = app.menu.map(function(s){return "<div>"+esc(s)+"</div>";}).join("")+
                  "<hr><div style=\"color:var(--sub)\">Esc 关闭</div>";
    m.style.left = Math.min(x, window.innerWidth-180)+"px";
    m.style.top = Math.min(y, window.innerHeight-app.menu.length*30-60)+"px";
    m.style.display = "block";
    log("menu", "RightClick("+win.uid+") → menu: "+app.menu.join(" / "));
    m.querySelectorAll("div").forEach(function(d){
      d.onclick = function(){ log("menu","Menu("+win.uid+") → "+d.textContent); hideMenu(); };
    });
  }
  function hideMenu(){ $("#ctx").style.display="none"; }
  document.addEventListener("click", function(e){ if(!e.target.closest("#ctx")) hideMenu(); });

  // ---- keyboard ---------------------------------------------------
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ hideMenu(); return; }
    if(e.target.tagName==="INPUT") return;
    var win = state.active; if(!win) return;
    var a = win.app, k = e.key;
    var hit = Object.keys(a.keys).filter(function(x){
      return x.toLowerCase()===k.toLowerCase() || x==="Enter" && k==="Enter"; })[0];
    if(hit) log("key","Key("+win.uid+", "+k+") → "+a.keys[hit]);
    else if(k.length===1) log("key","Key("+win.uid+", '"+k+"')");
    if(k==="Tab"){ e.preventDefault(); log("key","Key("+win.uid+", Tab) → 已消费（焦点保留）"); }
  });

  // ---- toolbar / filters -----------------------------------------
  $("#search").addEventListener("input", function(e){ state.q=e.target.value.toLowerCase().trim(); renderList(); });
  $("#filters").addEventListener("click", function(e){
    var c = e.target.closest(".chip"); if(!c) return;
    $("#filters").querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});
    c.classList.add("on"); state.filter=c.getAttribute("data-f"); renderList();
  });
  $("#btnOpen").onclick = function(){ openWindow(state.current); };
  $("#btnNew").onclick = function(){ openWindow(state.current); log("sys","[win] new window → 独立 CLR 槽 / 独立静态状态"); };
  $("#btnClear").onclick = function(){ $("#log").innerHTML=""; log("sys","log cleared"); };

  // ---- boot -------------------------------------------------------
  renderList();
  renderInspector();
  log("sys", "NexOS interactive prototype ready · "+APPS.length+" apps");
  log("sys", META.contract||"");
  openWindow(state.current);
})();
</script>
